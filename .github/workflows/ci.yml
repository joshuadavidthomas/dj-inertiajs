name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'

jobs:
  v3-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dj_inertiajs/tests/v3_frontend/package-lock.json
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: '3.12'
      - run: uv sync --locked --extra ssr
      - run: npm ci
        working-directory: dj_inertiajs/tests/v3_frontend
      - run: npx playwright install --with-deps chromium
        working-directory: dj_inertiajs/tests/v3_frontend
      - run: npm run test:compat
        working-directory: dj_inertiajs/tests/v3_frontend
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: '3.12'
      - run: uv build --no-sources .
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
