# remove when repo is made public and switch to pre-commit-ci
name: lint

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: lint-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv run nox --session "lint"
