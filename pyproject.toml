[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[dependency-groups]
dev = [
  "coverage[toml]>=7.9.1",
  "nox[uv]>=2025.5.1",
  "pytest>=8.3.5",
  "pytest-cov>=6.0.0",
  "pytest-django>=4.10.0",
  "ruff>=0.11.2",
]
types = [
  "django-stubs>=5.1.3",
  "django-stubs-ext>=5.1.3",
  "mypy>=1.16.1",
]

[project]
authors = [{name = "Josh Thomas", email = "josh@joshthomas.dev"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Framework :: Django :: 4",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
  "django>=4",
  "requests>=2",
  "typing-extensions>=4.14.0;python_version<='3.11'",
]
description = "Django adapter for Inertia.js"
keywords = ["inertia", "inertiajs", "django"]
license = {file = "LICENSE"}
name = "dj-inertiajs"
readme = "README.md"
requires-python = ">=3.9"
version = "1.2.0"

[project.urls]
Homepage = "https://github.com/joshuadavidthomas/dj-inertiajs"
Repository = "https://github.com/joshuadavidthomas/dj-inertiajs"

[tool.coverage.paths]
source = ["src"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if DEBUG:",
  "if not DEBUG:",
  "if settings.DEBUG:",
  "if TYPE_CHECKING:",
  'def __str__\(self\)\s?\-?\>?\s?\w*\:'
]
fail_under = 90

[tool.coverage.run]
omit = [
  "src/dj_inertiajs/_http.py",
  "src/dj_inertiajs/_typing.py",
  "tests/*"
]
source = ["src/dj_inertiajs"]

[tool.django-stubs]
django_settings_module = "tests.settings"
strict_settings = false

[tool.hatch.build]
exclude = [
  ".*",
  "Justfile"
]

[tool.hatch.build.targets.wheel]
packages = ["src/dj_inertiajs"]

[tool.mypy]
check_untyped_defs = true
exclude = [
  ".venv",
  "docs",
  "migrations",
  "tests",
  "venv"
]
mypy_path = "src/"
no_implicit_optional = true
plugins = [
  "mypy_django_plugin.main"
]
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
ignore_errors = true
ignore_missing_imports = true
module = [
  "*.migrations.*",
  "docs.*",
  "tests.*"
]

[tool.mypy_django_plugin]
ignore_missing_model_attributes = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
django_find_project = false
norecursedirs = ".* bin build dist *.egg htmlcov logs node_modules templates venv"
python_files = "tests.py test_*.py *_tests.py"
python_functions = "test* atest*"
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".github",
  ".hg",
  ".mypy_cache",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "__pypackages__",
  "_build",
  "build",
  "dist",
  "migrations",
  "node_modules",
  "venv"
]
extend-include = ["*.pyi?"]
indent-width = 4
# Same as Black.
line-length = 88
# Assume Python 3.9
target-version = "py39"

[tool.ruff.format]
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"
# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"
# Like Black, use double quotes for strings.
quote-style = "double"

[tool.ruff.lint]
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["A", "B", "C", "D", "E", "F", "I"]
ignore = ["E501", "E741"]  # temporary
select = [
  "B",  # flake8-bugbear
  "E",  # Pycodestyle
  "F",  # Pyflakes
  "I",  # isort
  "UP"  # pyupgrade
]
unfixable = []

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["dj_inertiajs"]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.per-file-ignores]
# Tests can use magic values, assertions, and relative imports
"tests/**/*" = ["PLR2004", "S101", "TID252"]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true
