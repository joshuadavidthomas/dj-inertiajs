[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dj-inertiajs"
version = "1.2.0"
description = "Django adapter for Inertia.js"
authors = [{name="Josh Thomas", email="josh@joshthomas.dev"}]
license = {file = "LICENSE"}
requires-python = ">=3.9"
readme = "README.md"
keywords = ["inertia", "inertiajs", "django"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Framework :: Django :: 4",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "django>=4",
    "requests>=2",
]

[project.urls]
Repository = "https://github.com/joshuadavidthomas/dj-inertiajs"
Homepage = "https://github.com/joshuadavidthomas/dj-inertiajs"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=6.0.0",
    "pytest-django>=4.10.0",
    "ruff>=0.11.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/inertia"]

[tool.ruff.lint]
select = [
    "E", # pycodestyle
    "W", # pycodestyle
    "F", # Pyflakes
    "B", # flake8-bugbear
    "SIM", # flake8-simplify
    "I", # isort
]
ignore = ["E501"] # line too long, formatter will handle this
unfixable = ["B", "SIM"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
django_find_project = false
norecursedirs = ".* bin build dist *.egg htmlcov logs node_modules templates venv"
python_files = "tests.py test_*.py *_tests.py"
python_functions = "test* atest*"
pythonpath = ["src", "."]
testpaths = ["tests"]
